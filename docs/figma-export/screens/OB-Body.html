<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>F1 · Thông tin cơ bản</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"><style>body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#1B211E}button,input,textarea{font-family:inherit;color:inherit}a{color:#C4461F}body{background:#F4F5F3}</style></head><body><div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F3; display: flex; flex-direction: column; padding: 52px 20px 34px; gap: 22px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="#" aria-label="Quay lại" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #FFFFFF; border: 1px solid #D5D9D6; color: #1B211E; box-sizing: border-box"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex-grow: 1; height: 6px; border-radius: 3px; background: #E3E7E4"><div style="width: 28%; height: 6px; border-radius: 3px; background: #C4461F"></div></div>
<span style="font-size: 13px; color: #5E6863; font-weight: 500">2/7</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700">Cho coach biết một chút về bạn</h1>
<p style="margin: 0; font-size: 15px; color: #5E6863">Dùng để tính lượng calo và mức tập phù hợp. Chỉ bạn thấy.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 600">Giới tính</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 48px; border-radius: 12px; border: 2px solid #C4461F; background: #FCEDE7; font-size: 15px; font-weight: 600">Nam</button>
<button type="button" style="height: 48px; border-radius: 12px; border: 1.5px solid #D5D9D6; background: #FFFFFF; font-size: 15px; font-weight: 500">Nữ</button>
<button type="button" style="height: 48px; border-radius: 12px; border: 1.5px solid #D5D9D6; background: #FFFFFF; font-size: 15px; font-weight: 500">Khác</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<label for="ob-year" style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">Năm sinh<input id="ob-year" value="1998" style="height: 48px; border-radius: 12px; border: 1.5px solid #D5D9D6; background: #FFFFFF; padding: 0 14px; font-size: 16px; box-sizing: border-box"></label>
<label for="ob-height" style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">Chiều cao (cm)<input id="ob-height" value="170" style="height: 48px; border-radius: 12px; border: 1.5px solid #D5D9D6; background: #FFFFFF; padding: 0 14px; font-size: 16px; box-sizing: border-box"></label>
<label for="ob-weight" style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">Cân nặng (kg)<input id="ob-weight" value="70" style="height: 48px; border-radius: 12px; border: 1.5px solid #D5D9D6; background: #FFFFFF; padding: 0 14px; font-size: 16px; box-sizing: border-box"></label>
<label for="ob-goal" style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">Mục tiêu (kg)<input id="ob-goal" value="65" style="height: 48px; border-radius: 12px; border: 1.5px solid #D5D9D6; background: #FFFFFF; padding: 0 14px; font-size: 16px; box-sizing: border-box"></label>
</div>
<div style="padding: 14px 16px; border-radius: 14px; background: #E1F0EC; color: #17584D; font-size: 14px; line-height: 1.5">Mục tiêu 65kg: coach đề xuất giảm khoảng 0.5kg mỗi tuần, tức khoảng 10 tuần. Tốc độ này an toàn và dễ giữ.</div>
</div>
<a href="#" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #C4461F; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none">Tiếp tục</a>
</div></body></html>
