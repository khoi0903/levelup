<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>F2 · Chấm độ khó</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"><style>body{margin:0;font-family:"Be Vietnam Pro",system-ui,sans-serif;color:#1B211E}button,input,textarea{font-family:inherit;color:inherit}a{color:#C4461F}body{background:#F4F5F3}</style></head><body><div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F3; display: flex; flex-direction: column; padding: 72px 20px 34px; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 26px; line-height: 1.25; font-weight: 700">Buổi tập vừa rồi thế nào?</h1>
<p style="margin: 0; font-size: 15px; color: #5E6863; line-height: 1.5">Coach dùng điểm này để quyết định buổi sau tăng, giữ hay giảm.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 52px; border-radius: 12px; border: 1.5px solid #D5D9D6; background: #FFFFFF; font-size: 17px; font-weight: 600">1</button>
<button type="button" style="height: 52px; border-radius: 12px; border: 1.5px solid #D5D9D6; background: #FFFFFF; font-size: 17px; font-weight: 600">2</button>
<button type="button" style="height: 52px; border-radius: 12px; border: 1.5px solid #D5D9D6; background: #FFFFFF; font-size: 17px; font-weight: 600">3</button>
<button type="button" style="height: 52px; border-radius: 12px; border: 1.5px solid #D5D9D6; background: #FFFFFF; font-size: 17px; font-weight: 600">4</button>
<button type="button" style="height: 52px; border-radius: 12px; border: 1.5px solid #D5D9D6; background: #FFFFFF; font-size: 17px; font-weight: 600">5</button>
<button type="button" style="height: 52px; border-radius: 12px; border: 1.5px solid #D5D9D6; background: #FFFFFF; font-size: 17px; font-weight: 600">6</button>
<button type="button" style="height: 52px; border-radius: 12px; border: 0; background: #C4461F; color: #FFFFFF; font-size: 17px; font-weight: 700">7</button>
<button type="button" style="height: 52px; border-radius: 12px; border: 1.5px solid #D5D9D6; background: #FFFFFF; font-size: 17px; font-weight: 600">8</button>
<button type="button" style="height: 52px; border-radius: 12px; border: 1.5px solid #D5D9D6; background: #FFFFFF; font-size: 17px; font-weight: 600">9</button>
<button type="button" style="height: 52px; border-radius: 12px; border: 1.5px solid #D5D9D6; background: #FFFFFF; font-size: 17px; font-weight: 600">10</button>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #5E6863"><span>Rất nhẹ</span><span>Vừa sức</span><span>Kiệt sức</span></div>
<div style="padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #D5D9D6; font-size: 14px; line-height: 1.5"><b>7 · Hơi nặng nhưng làm được.</b> Còn sức làm thêm khoảng 2–3 lần nữa.</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; font-weight: 600">Có chỗ nào đau không?</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid #C4461F; background: #FCEDE7; color: #9E3616; font-size: 14px; font-weight: 600">Không</button>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid #D5D9D6; background: #FFFFFF; font-size: 14px; font-weight: 500">Lưng</button>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid #D5D9D6; background: #FFFFFF; font-size: 14px; font-weight: 500">Gối</button>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid #D5D9D6; background: #FFFFFF; font-size: 14px; font-weight: 500">Vai</button>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid #D5D9D6; background: #FFFFFF; font-size: 14px; font-weight: 500">Khác</button>
</div>
</div>
<label for="rpe-note" style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">Ghi chú cho coach <span style="font-weight: 400; color: #5E6863">(không bắt buộc)</span>
<textarea id="rpe-note" rows="3" placeholder="Ví dụ: plank hơi khó giữ" style="border-radius: 14px; border: 1.5px solid #D5D9D6; background: #FFFFFF; padding: 12px 14px; font-size: 15px; resize: none; box-sizing: border-box"></textarea></label>
<a href="#" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #C4461F; color: #FFFFFF; font-weight: 600; font-size: 16px; text-decoration: none">Xem kết quả</a>
</div></body></html>
