# Profile dev: chạy khi chưa có Firebase.
# Gửi header "Authorization: Bearer dev-<uid>" thay cho token Firebase thật.
# Chạy: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
levelup:
  auth:
    dev-tokens: true
  # Flutter web: localhost (cổng ngẫu nhiên) và điện thoại mở qua Wi-Fi (192.168.x.x)
  cors:
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*

# Cổng 8080 trên máy dev đã bị chương trình khác dùng
server:
  port: ${PORT:8081}
