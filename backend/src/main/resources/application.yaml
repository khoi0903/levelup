spring:
  application:
    name: levelup-backend
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27018/fitness?replicaSet=rs0}
    # Luôn dùng database "fitness", kể cả khi chuỗi Atlas không ghi tên database (…mongodb.net/?appName=…)
    database: ${MONGODB_DATABASE:fitness}
  data:
    mongodb:
      # Index và validator do mongo/init.js quản lý, không để Spring tự tạo
      auto-index-creation: false
  servlet:
    multipart:
      # Ảnh món ăn (POST /meals/recognize) tối đa 2 MB
      max-file-size: 2MB
      max-request-size: 3MB

server:
  # Render kết thúc HTTPS ở proxy; link giới thiệu dùng đúng origin công khai.
  forward-headers-strategy: framework
  port: ${PORT:8080}
  servlet:
    encoding:
      # Ghi rõ "charset=UTF-8" trong Content-Type. Thiếu dòng này, gói http của Dart
      # đọc JSON theo latin1 và tiếng Việt bị lỗi font.
      charset: UTF-8
      force-response: true

levelup:
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:levelup-pro}
  fcm:
    # Đường dẫn file service account (Firebase → Service accounts), để NGOÀI repo. Trống = chỉ ghi log.
    credentials: ${FIREBASE_CREDENTIALS:}
  default-timezone: Asia/Ho_Chi_Minh
  ai:
    # claude | gemini | groq | auto (auto: có ANTHROPIC_API_KEY thì Claude, không thì Gemini rồi Groq theo key có sẵn)
    provider: ${LEVELUP_AI_PROVIDER:auto}
    # Model Claude dùng chung cho coach, tổng kết tuần, nhận diện món ăn
    model: ${LEVELUP_AI_MODEL:claude-opus-5-5}
    gemini-model: ${LEVELUP_GEMINI_MODEL:gemini-3.5-flash}
    groq-model: ${LEVELUP_GROQ_MODEL:openai/gpt-oss-120b}
    timeout-seconds: 20
    # Có nhà cung cấp dự phòng phía sau thì nơi trước chỉ chờ chừng này giây
    fallback-timeout-seconds: 10
  jobs:
    # Header X-Job-Secret của POST /jobs/tick; để trống thì endpoint luôn trả 403
    secret: ${JOB_SECRET:}
  demo:
    # POST /demo/{action}: tắt hẳn ngoài bản demo (DEMO_MODE=true để bật)
    enabled: ${DEMO_MODE:false}
    # uid được dùng nút giả lập, phân cách bằng dấu phẩy; "demo*" là mọi uid bắt đầu bằng "demo"
    uids: ${DEMO_UIDS:}
  nutrition:
    # Số lần chụp món gọi AI mỗi ngày (ảnh đã nhận diện rồi thì không tính)
    daily-photo-limit: 10
  coach:
    # Số tin chat với coach mỗi ngày (theo ngày của người dùng), hết thì 429 COACH_LIMIT
    daily-limit: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Tài liệu API (OpenAPI/Swagger) chỉ bật ở profile dev, server thật không mở công khai
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
