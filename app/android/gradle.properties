# Máy dev 8 GB RAM: mặc định -Xmx8G của template Flutter làm Gradle sập (Out of Memory)
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1024m
# Project ở ổ D, pub cache ở ổ C: Kotlin incremental lỗi "Could not close incremental caches" khi khác ổ
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# AGP 9.1 chỉ khuyến nghị tới API 36; app compile với 37 vì permission_handler
android.suppressUnsupportedCompileSdk=37
